plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forsite.javadprocessor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.forsite.javadprocessor'
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName '1.9-wait-control'
        manifestPlaceholders = [appAuthRedirectScheme: 'javadprocessor']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'net.openid:appauth:0.11.1'
    testImplementation 'junit:junit:4.13.2'
}
