name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          settings_file="$(find . -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$settings_file" ]; then
            echo "No settings.gradle found. Upload the extracted project files, including the app folder."
            exit 1
          fi
          project_dir="$(dirname "$settings_file")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Found Android project in $project_dir"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest assembleDebug

      - name: Save finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Javad-File-Processor-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
